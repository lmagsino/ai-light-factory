<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="AI Light Factory: you write a PRD; the Architect (grill-with-docs) settles decisions; the Planner writes the plan (agent-skills plan) and opens tickets with blocking edges (to-tickets); the dev loop runs a Developer, a Reviewer from another vendor and a PR Guardian to a draft PR; the Verifier (/alf:verify) checks every flag state; you merge."><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15191D"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E8D"/></marker></defs><text x="20" y="22" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">ONCE PER PROJECT</text><rect x="20" y="34" width="110" height="100" rx="3" fill="#FFFFFF" stroke="#15191D" stroke-width="2"/><text x="36" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">INPUT</text><text x="36" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">PRD</text><text x="36" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">you write it</text><line x1="130" y1="84" x2="168" y2="84" stroke="#15191D" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="170" y="34" width="240" height="100" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="186" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">1 · DECIDE · MATT POCOCK</text><text x="186" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Architect</text><text x="186" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">grill-with-docs</text><line x1="410" y1="84" x2="488" y2="84" stroke="#15191D" stroke-width="1.6" marker-end="url(#ah-ink)"/><path d="M443.0 84 l6 -6 l6 6 l-6 6 z" fill="#15191D"/><text x="449.0" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#15191D">decisions</text><text x="449.0" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#15191D">hold?</text><rect x="490" y="34" width="560" height="100" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="506" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">2–3 · PLAN · TICKETS · ADDY OSMANI · MATT POCOCK</text><text x="506" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Planner</text><text x="506" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">agent-skills:plan</text><line x1="640" y1="104" x2="858" y2="104" stroke="#15191D" stroke-width="1.6" marker-end="url(#ah-ink)"/><path d="M743.0 104 l6 -6 l6 6 l-6 6 z" fill="#15191D"/><text x="749.0" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#15191D">right plan?</text><text x="866" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">to-tickets</text><path d="M930 134 V176 H95 V214" fill="none" stroke="#0F6E8D" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="525" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F6E8D">readiness gate: only settled tickets enter</text><rect x="20" y="216" width="740" height="290" rx="4" fill="none" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="8 5"/><text x="40" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0F6E8D">4 · DEV LOOP · /alf:dev-loop · UNATTENDED · MAX 2 LANES</text><rect x="45" y="270" width="190" height="96" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="61" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">AGENT A</text><text x="61" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Developer</text><text x="61" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">agent-skills build, TDD</text><rect x="315" y="270" width="200" height="96" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="331" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">AGENT B · OTHER VENDOR</text><text x="331" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Reviewer</text><text x="331" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">agent-skills review</text><line x1="235" y1="298" x2="313" y2="298" stroke="#0F6E8D" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="275" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">diff</text><line x1="315" y1="340" x2="237" y2="340" stroke="#0F6E8D" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="275" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">findings</text><rect x="565" y="270" width="175" height="96" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="581" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">OUTPUT</text><text x="581" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Draft PR</text><text x="581" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">green tests, decision log</text><line x1="515" y1="318" x2="563" y2="318" stroke="#0F6E8D" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="540" y="310" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">clean</text><rect x="565" y="404" width="175" height="86" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="581" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">AGENT · BATCHED</text><text x="581" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">PR Guardian</text><text x="581" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">answers review threads</text><line x1="652" y1="366" x2="652" y2="402" stroke="#0F6E8D" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="645" y="389" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">threads</text><text x="45" y="432" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#56606A">Up to two tickets at a time, at most two review rounds each.</text><text x="45" y="456" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#15191D">No worker can merge, mark ready or approve.</text><text x="800" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#56606A">PER PARENT ISSUE OR MILESTONE</text><line x1="760" y1="318" x2="798" y2="318" stroke="#15191D" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="800" y="270" width="175" height="96" rx="3" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="816" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">5 · VERIFY</text><text x="816" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Verifier</text><text x="816" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#56606A">/alf:verify</text><line x1="975" y1="318" x2="1003" y2="318" stroke="#15191D" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="1005" y="270" width="175" height="96" rx="3" fill="#FFFFFF" stroke="#15191D" stroke-width="2"/><text x="1021" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#56606A">YOU</text><text x="1021" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#15191D">Merge</text><text x="1021" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">you read every diff</text><rect x="20" y="528" width="30" height="14" fill="#E4F2F7" stroke="#0F6E8D" stroke-width="1.4" stroke-dasharray="5 3"/><text x="58" y="540" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">agents draft</text><rect x="170" y="528" width="30" height="14" fill="#FFFFFF" stroke="#15191D" stroke-width="1.8"/><text x="208" y="540" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">you decide</text><path d="M335 535 l5 -5 l5 5 l-5 5 z" fill="#15191D"/><text x="352" y="540" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#56606A">a gate you approve</text><text x="1180" y="540" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#56606A">stages 1–3: Matt Pocock and Addy Osmani skills · 4–5: AI Light Factory</text></svg>