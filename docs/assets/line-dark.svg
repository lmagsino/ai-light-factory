<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="AI Light Factory: PRD, Architect, Planner, Tickets, an unattended build band with a Developer and a Reviewer from another vendor producing a draft PR, a Verifier, and you merge."><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E6EAED"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6CC6E3"/></marker></defs><text x="20" y="22" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9BA6AF">ONCE PER PROJECT</text><rect x="20" y="34" width="110" height="100" rx="3" fill="#161B22" stroke="#E6EAED" stroke-width="2"/><text x="36" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">INPUT</text><text x="36" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">PRD</text><text x="36" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">you write it</text><line x1="130" y1="84" x2="168" y2="84" stroke="#E6EAED" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="170" y="34" width="240" height="100" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="186" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">1 · ARCHITECT</text><text x="186" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Settle decisions</text><text x="186" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">one question at a time</text><line x1="410" y1="84" x2="488" y2="84" stroke="#E6EAED" stroke-width="1.6" marker-end="url(#ah-ink)"/><path d="M443.0 84 l6 -6 l6 6 l-6 6 z" fill="#E6EAED"/><text x="449.0" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EAED">decisions</text><text x="449.0" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EAED">hold?</text><rect x="490" y="34" width="240" height="100" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="506" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">2 · PLANNER</text><text x="506" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Plan with real edges</text><text x="506" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">XS/S tickets, blocking edges</text><line x1="730" y1="84" x2="808" y2="84" stroke="#E6EAED" stroke-width="1.6" marker-end="url(#ah-ink)"/><path d="M763.0 84 l6 -6 l6 6 l-6 6 z" fill="#E6EAED"/><text x="769.0" y="54" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EAED">right</text><text x="769.0" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E6EAED">tickets?</text><rect x="810" y="34" width="240" height="100" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="826" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">2 · TICKETS</text><text x="826" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Create the issues</text><text x="826" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">dry run, then “create these?”</text><path d="M930 134 V176 H95 V214" fill="none" stroke="#6CC6E3" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="525" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6CC6E3">readiness gate: only settled tickets enter</text><rect x="20" y="216" width="740" height="236" rx="4" fill="none" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="40" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6CC6E3">3 · BUILD BAND · UNATTENDED · MAX 2 LANES</text><rect x="45" y="270" width="190" height="96" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="61" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">AGENT A</text><text x="61" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Developer</text><text x="61" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">builds test-first</text><rect x="315" y="270" width="200" height="96" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="331" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">AGENT B · OTHER VENDOR</text><text x="331" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Reviewer</text><text x="331" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">fresh eyes, ≤ 2 rounds</text><line x1="235" y1="298" x2="313" y2="298" stroke="#6CC6E3" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="275" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9BA6AF">diff</text><line x1="315" y1="340" x2="237" y2="340" stroke="#6CC6E3" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="275" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9BA6AF">findings</text><rect x="565" y="270" width="175" height="96" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="581" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">OUTPUT</text><text x="581" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Draft PR</text><text x="581" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">green tests, decision log</text><line x1="515" y1="318" x2="563" y2="318" stroke="#6CC6E3" stroke-width="1.6" marker-end="url(#ah-blue)"/><text x="540" y="310" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9BA6AF">clean</text><text x="45" y="404" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9BA6AF">PR Guardian sweeps review threads and rebases stacks.</text><text x="45" y="426" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#E6EAED">No worker can merge, mark ready or approve.</text><text x="800" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9BA6AF">PER MILESTONE</text><line x1="760" y1="318" x2="798" y2="318" stroke="#E6EAED" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="800" y="270" width="175" height="96" rx="3" fill="#11303A" stroke="#6CC6E3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="816" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">4 · VERIFIER</text><text x="816" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Verify</text><text x="816" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">every flag state</text><line x1="975" y1="318" x2="1003" y2="318" stroke="#E6EAED" stroke-width="1.6" marker-end="url(#ah-ink)"/><rect x="1005" y="270" width="175" height="96" rx="3" fill="#161B22" stroke="#E6EAED" stroke-width="2"/><text x="1021" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#9BA6AF">YOU</text><text x="1021" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EAED">Merge</text><text x="1021" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">you read every diff</text><rect x="20" y="478" width="30" height="14" fill="#11303A" stroke="#6CC6E3" stroke-width="1.4" stroke-dasharray="5 3"/><text x="58" y="490" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">agents draft</text><rect x="170" y="478" width="30" height="14" fill="#161B22" stroke="#E6EAED" stroke-width="1.8"/><text x="208" y="490" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">you decide</text><path d="M335 485 l5 -5 l5 5 l-5 5 z" fill="#E6EAED"/><text x="352" y="490" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA6AF">a gate you approve</text></svg>