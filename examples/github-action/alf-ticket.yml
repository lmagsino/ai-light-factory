# EXPERIMENTAL: run one ticket through AI Light Factory's band when an issue is labelled.
#
# Copy to .github/workflows/ in the repo you want to build in (not in AI Light Factory).
# It runs the readiness gate first, then the band for that single ticket with one
# lane, a budget of one, a turn cap and a job timeout. It opens at most one
# DRAFT PR, and never merges.
#
# Secrets: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN), and OPENAI_API_KEY for a
# cross-vendor Codex reviewer. Without OPENAI_API_KEY the reviewer falls back to
# Claude, and the PR says "same-vendor review".
#
# If you use a fork of AI Light Factory, point the two AI Light Factory references below at it.

name: AI Light Factory · one ticket

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: alf-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  band:
    if: github.event.label.name == 'factory:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 60          # the time budget for one ticket
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: lmagsino/ai-light-factory
          path: .alf-src

      - name: Readiness gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .alf-src/bin/alf-ready "${{ github.event.issue.number }}" --label

      - name: Codex for the cross-vendor reviewer
        if: env.OPENAI_API_KEY != ''
        run: |
          npm install -g @openai/codex
          printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Band, one ticket
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/lmagsino/ai-light-factory.git
          plugins: alf@ai-light-factory
          prompt: "/alf:loop #${{ github.event.issue.number }} --lanes 1 --budget 1"
          claude_args: "--max-turns 300"
